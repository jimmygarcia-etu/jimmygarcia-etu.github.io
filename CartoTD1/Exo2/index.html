<html>
<head>

	<script type="importmap">

	</script>
</head>
<body>
	<div id="map" style="height: 400px"></div>
	<script type="module">
    import {LeafletMap, TileLayer, Marker, Circle, Polygon, Popup} from 'leaflet';


    
    function success(position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        map.setView([latitude, longitude], 15);
        const marker = new Marker([latitude, longitude]).addTo(map);
        const circle = new Circle([latitude, longitude], {
            color: 'blue',
            fillColor: 'blue',
            fillOpacity: 0.3,
            radius: position.coords.accuracy
        }).addTo(map);

    }

    function error() {
        console.error("Error getting location");
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(success, error);
    }else {
         error();
    }
    const map = new LeafletMap('map').setView([0.0, 0.0], 15);
    const marker = new Marker([43.70, 7.26]).addTo(map);
    const polygon = new Polygon([
        [32.3, -64.78],
        [25.79, -80.23],
        [18.47, -66.11]
    ],
    {
        color: 'red',
        fillColor: '#f03',
        fillOpacity: 0.5
    }
    ).addTo(map);


    
    new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
	</script>
</body>
